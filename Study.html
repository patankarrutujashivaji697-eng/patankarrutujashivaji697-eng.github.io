<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class 12 Science Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-glow: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    /* Outer Wrapper for Animated Glowing Border */
    .glow-wrapper {
      position: relative;
      border-radius: 20px;
      padding: 2px; /* Border thickness */
      background: var(--accent-glow);
      background-size: 300% 300%;
      animation: glowingBorder 6s ease infinite;
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
      transition: box-shadow 0.4s ease, transform 0.4s ease;
    }

    @keyframes glowingBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Smooth Hover Scale & Glow Enhancement */
    .glow-wrapper:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 0 45px rgba(236, 72, 153, 0.5);
    }

    /* Main Card Container */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      max-width: 400px;
      padding: 24px;
      color: var(--text-main);
    }

    /* Image Styling with Hover Zoom */
    .image-container {
      overflow: hidden;
      border-radius: 12px;
      max-height: 200px;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .glow-wrapper:hover .card-img {
      transform: scale(1.08);
    }

    /* Header Styling */
    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 16px 0 8px 0;
    }

    .card-description {
      font-size: 0.95rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin: 0;
    }

    /* Slick Animated Content Divider */
    .slick-divider {
      height: 2px;
      margin: 20px 0;
      border: none;
      background: linear-gradient(90deg, transparent, #3b82f6, #ec4899, transparent);
      background-size: 200% 100%;
      animation: dividerGlow 3s linear infinite;
    }

    @keyframes dividerGlow {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* Subject List Grid */
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .subject-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .glow-wrapper:hover .subject-pill {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div class="glow-wrapper">
    <div class="card">
      <div class="image-container">
        <img src="https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcSPUqDZkKlQ-J6x8T2m7vANSvyvhB1hu7tGkZwxQof2uHiDFbQBuehMApmagHf_3XfN-9l601A2Vh0K44Y" alt="Physics Diagram" class="card-img">
      </div>
      
      <h2 class="card-title">Class 12 Science Core</h2>
      <p class="card-description">Master fundamental concepts across key Science streams with interactive notes and step-by-step guides.</p>
      
      <div class="slick-divider"></div>

      <div class="subjects-grid">
        <div class="subject-pill">Physics</div>
        <div class="subject-pill">Chemistry</div>
        <div class="subject-pill">Mathematics</div>
        <div class="subject-pill">Biology</div>
      </div>
    </div>
  </div>

</body>
  </html>
