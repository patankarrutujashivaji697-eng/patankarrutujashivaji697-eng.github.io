<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class 12 Ultimate Study Dashboard by Rutuja Patankar</title>
  <meta name="author" content="Rutuja Patankar">
<meta name="description" content="Class 12 Ultimate Study Dashboard by Rutuja Patankar. Track your board exam preparation, study streaks, and use the built-in Pomodoro focus timer.">
<meta name="keywords" content="Rutuja Patankar, Class 12, Ultimate Study Dashboard, Pomodoro Timer, Student Planner">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(226, 232, 240, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #6366f1;
      --accent: #ec4899;
      --success: #10b981;
      --warning: #f59e0b;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
      --input-bg: #ffffff;
      --item-bg: #f1f5f9;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --input-bg: #1e293b;
      --item-bg: rgba(15, 23, 42, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }
    body { background: var(--bg); color: var(--text-main); padding: 24px; min-height: 100vh; }
    .container { max-width: 1300px; margin: 0 auto; }

    /* Header & Navigation */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 15px; }
    header h1 { font-weight: 800; font-size: 1.8rem; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .theme-toggle { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      color: var(--text-main); 
      padding: 10px 18px; 
      border-radius: 20px; 
      cursor: pointer; 
      font-weight: 700; 
      backdrop-filter: blur(12px); 
      box-shadow: var(--shadow);
    }
    .theme-toggle:hover { transform: translateY(-2px); }

    /* Stat Cards Row */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); }
    .stat-card h4 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 1.8rem; font-weight: 800; margin-top: 8px; color: var(--primary); }

    /* Main Dashboard Layout */
    .grid { display: grid; grid-template-columns: 320px 1fr 340px; gap: 24px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); padding: 24px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 24px; }
    .card h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

    /* Forms & Inputs */
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); }
    input, select { width: 100%; padding: 10px 14px; border: 1px solid var(--card-border); background: var(--input-bg); color: var(--text-main); border-radius: 10px; font-size: 0.9rem; outline: none; }
    button.btn-primary { width: 100%; background: linear-gradient(135deg, var(--primary), #4338ca); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    button.btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }

    /* Pomodoro Module */
    .timer-display { font-size: 3.5rem; font-weight: 800; text-align: center; margin: 15px 0; color: var(--text-main); font-variant-numeric: tabular-nums; }
    .preset-btns { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }
    .preset-btn { background: var(--item-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .timer-controls { display: flex; gap: 10px; }
    .timer-controls button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; color: white; }

    /* Task List & Filters */
    .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
    .tab { padding: 6px 14px; background: var(--item-bg); border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; border: 1px solid var(--card-border); color: var(--text-muted); }
    .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

    .task-item { background: var(--item-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .task-title { font-weight: 700; font-size: 0.95rem; }
    .tag { padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; background: var(--primary); color: white; }
    
    /* Spaced Repetition Checkboxes */
    .repetition-tracker { display: flex; gap: 12px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--card-border); }
    .rep-check { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); cursor: pointer; }
    .rep-check input { width: auto; cursor: pointer; }

    /* Progress Bars */
    .progress-item { margin-bottom: 12px; }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
    .progress-bg { height: 8px; background: var(--item-bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--card-border); }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 0.4s ease; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Class 12 Prep Dashboard</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Track syllabus, revisions, and study sessions.</p>
      </div>
      <!-- Dark/Light Mode Button -->
      <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
    </header>

    <!-- Stat Summary Cards -->
    <div class="stats-row">
      <div class="stat-card">
        <h4>Target Countdown</h4>
        <div class="value" id="countdown">-- Days</div>
      </div>
      <div class="stat-card">
        <h4>Study Streak</h4>
        <div class="value" id="streak-count">🔥 1 Day</div>
      </div>
      <div class="stat-card">
        <h4>Overall Progress</h4>
        <div class="value" id="overall-progress">0%</div>
      </div>
      <div class="stat-card">
        <h4>Pending Tasks</h4>
        <div class="value" id="pending-count">0</div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="grid">
      
      <!-- Left Column: Focus & Form -->
      <div>
        <div class="card">
          <h2>Pomodoro Focus</h2>
          <div class="preset-btns">
            <button class="preset-btn" onclick="setTimerPreset(25)">25m Study</button>
            <button class="preset-btn" onclick="setTimerPreset(50)">50m Deep</button>
            <button class="preset-btn" onclick="setTimerPreset(5)">5m Break</button>
          </div>
          <div class="timer-display" id="timer-display">25:00</div>
          <div class="timer-controls">
            <button onclick="startTimer()" style="background: var(--success);">Start</button>
            <button onclick="pauseTimer()" style="background: var(--warning);">Pause</button>
            <button onclick="resetTimer()" style="background: #ef4444;">Reset</button>
          </div>
        </div>

        <div class="card">
          <h2>Add New Task</h2>
          <form id="task-form">
            <div class="form-group">
              <label for="subject">Subject</label>
              <select id="subject" required>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Biology">Biology</option>
                <option value="English">English</option>
                <option value="IT">IT</option>
                <option value="Optional">Optional / Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="topic">Topic / Chapter</label>
              <input type="text" id="topic" placeholder="e.g., Matrices & Determinants" required>
            </div>
            <div class="form-group">
              <label for="target-date">Target Date</label>
              <input type="date" id="target-date" required>
            </div>
            <button type="submit" class="btn-primary">+ Add Chapter Task</button>
          </form>
        </div>
      </div>

      <!-- Center Column: Schedule -->
      <div>
        <div class="card">
          <h2>Study Schedule</h2>
          <div class="filter-tabs" id="filter-tabs">
            <button class="tab active" onclick="filterSubject('All')">All</button>
            <button class="tab" onclick="filterSubject('Physics')">Physics</button>
            <button class="tab" onclick="filterSubject('Chemistry')">Chemistry</button>
            <button class="tab" onclick="filterSubject('Mathematics')">Maths</button>
            <button class="tab" onclick="filterSubject('Biology')">Biology</button>
            <button class="tab" onclick="filterSubject('English')">English</button>
            <button class="tab" onclick="filterSubject('IT')">IT</button>
          </div>
          <div id="task-container"></div>
        </div>
      </div>

      <!-- Right Column: Subject Progress -->
      <div>
        <div class="card">
          <h2>Subject Progress</h2>
          <div id="subject-progress-container"></div>
        </div>

        <div class="card">
          <h2>Exam Date Settings</h2>
          <div class="form-group">
            <label for="exam-date-input">Target Board / Entrance Date</label>
            <input type="date" id="exam-date-input" onchange="updateExamDate(this.value)">
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // --- Dark / Light Theme Switching Logic ---
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const themeBtn = document.getElementById('theme-btn');
      if (theme === 'dark') {
        themeBtn.textContent = '☀️ Light Mode';
      } else {
        themeBtn.textContent = '🌙 Dark Mode';
      }
      localStorage.setItem('theme', theme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
    }

    // Initialize Theme on Page Load
    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    // --- Audio Notification for Pomodoro ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep() {
      const osc = audioCtx.createOscillator();
      osc.connect(audioCtx.destination);
      osc.frequency.value = 587.33;
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // --- Pomodoro Timer ---
    let timerSeconds = 25 * 60;
    let timerInterval = null;

    function updateTimerDisplay() {
      const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const s = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
    }

    function setTimerPreset(minutes) {
      pauseTimer();
      timerSeconds = minutes * 60;
      updateTimerDisplay();
    }

    function startTimer() {
      if (timerInterval) return;
      audioCtx.resume();
      timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
          timerSeconds--;
          updateTimerDisplay();
        } else {
          pauseTimer();
          playBeep();
          alert("Time's up! Take a break.");
        }
      }, 1000);
    }

    function pauseTimer() { clearInterval(timerInterval); timerInterval = null; }
    function resetTimer() { pauseTimer(); timerSeconds = 25 * 60; updateTimerDisplay(); }

    // --- App Data ---
    const subjects = ['Physics', 'Chemistry', 'Mathematics', 'Biology', 'English', 'IT', 'Optional'];
    let activeFilter = 'All';
    let tasks = JSON.parse(localStorage.getItem('class12_pro_tasks')) || [];
    let targetExamDate = localStorage.getItem('class12_exam_date') || '2027-02-15';

    document.getElementById('exam-date-input').value = targetExamDate;

    function saveData() {
      localStorage.setItem('class12_pro_tasks', JSON.stringify(tasks));
      renderDashboard();
    }

    function updateExamDate(val) {
      targetExamDate = val;
      localStorage.setItem('class12_exam_date', val);
      calculateCountdown();
    }

    function calculateCountdown() {
      const diff = new Date(targetExamDate) - new Date();
      const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
      document.getElementById('countdown').textContent = days > 0 ? `${days} Days` : 'Exam Time!';
    }

    // --- Task Handling ---
    document.getElementById('task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      tasks.push({
        id: Date.now(),
        subject: document.getElementById('subject').value,
        topic: document.getElementById('topic').value,
        date: document.getElementById('target-date').value,
        read: false,
        rev1: false,
        pyq: false
      });
      document.getElementById('task-form').reset();
      saveData();
    });

    function filterSubject(sub) {
      activeFilter = sub;
      document.querySelectorAll('.filter-tabs .tab').forEach(t => {
        t.classList.toggle('active', t.textContent.includes(sub) || (sub === 'All' && t.textContent === 'All'));
      });
      renderTasks();
    }

    function toggleStage(id, stage) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task[stage] = !task[stage];
        if (task.read && task.rev1 && task.pyq) {
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
        }
        saveData();
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveData();
    }

    // --- Render Functions ---
    function renderTasks() {
      const container = document.getElementById('task-container');
      const filtered = activeFilter === 'All' ? tasks : tasks.filter(t => t.subject === activeFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 20px;">No chapters found for this filter.</p>`;
        return;
      }

      container.innerHTML = filtered.map(t => `
        <div class="task-item">
          <div class="task-header">
            <div>
              <span class="tag">${t.subject}</span>
              <div class="task-title" style="margin-top: 4px;">${t.topic}</div>
            </div>
            <button onclick="deleteTask(${t.id})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:0.8rem;">Delete</button>
          </div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Target: ${t.date}</div>
          <div class="repetition-tracker">
            <label class="rep-check">
              <input type="checkbox" ${t.read ? 'checked' : ''} onchange="toggleStage(${t.id}, 'read')"> 1st Read
            </label>
            <label class="rep-check">
              <input type="checkbox" ${t.rev1 ? 'checked' : ''} onchange="toggleStage(${t.id}, 'rev1')"> 1st Rev
            </label>
            <label class="rep-check">
              <input type="checkbox" ${t.pyq ? 'checked' : ''} onchange="toggleStage(${t.id}, 'pyq')"> PYQs Completed
            </label>
          </div>
        </div>
      `).join('');
    }

    function renderProgress() {
      const container = document.getElementById('subject-progress-container');
      let totalStagesAll = 0;
      let completedStagesAll = 0;

      container.innerHTML = subjects.map(sub => {
        const subTasks = tasks.filter(t => t.subject === sub);
        const totalStages = subTasks.length * 3;
        const completedStages = subTasks.reduce((acc, t) => acc + (t.read ? 1 : 0) + (t.rev1 ? 1 : 0) + (t.pyq ? 1 : 0), 0);
        
        totalStagesAll += totalStages;
        completedStagesAll += completedStages;

        const pct = totalStages === 0 ? 0 : Math.round((completedStages / totalStages) * 100);

        return `
          <div class="progress-item">
            <div class="progress-info">
              <span>${sub}</span>
              <span>${pct}%</span>
            </div>
            <div class="progress-bg">
              <div class="progress-fill" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      const overallPct = totalStagesAll === 0 ? 0 : Math.round((completedStagesAll / totalStagesAll) * 100);
      document.getElementById('overall-progress').textContent = `${overallPct}%`;
      
      const pending = tasks.filter(t => !(t.read && t.rev1 && t.pyq)).length;
      document.getElementById('pending-count').textContent = pending;
    }

    function renderDashboard() {
      calculateCountdown();
      renderTasks();
      renderProgress();
    }

    renderDashboard();
  </script>
</body>
</html>
